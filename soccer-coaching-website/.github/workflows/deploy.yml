name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    concurrency: ci-${{ github.ref }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: soccer-coaching-website/package-lock.json # Add this!

      - name: Install dependencies
        run: npm install
        working-directory: soccer-coaching-website

      - name: Build website
        run: npm run build
        working-directory: soccer-coaching-website

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: soccer-coaching-website/build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
